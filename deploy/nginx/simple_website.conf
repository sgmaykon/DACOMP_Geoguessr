# ────────────────────────────────────────────────────────────────────────────
# TEMPLATE do site estático + proxy para o backend.
#
# Este arquivo no repositório é uma TEMPLATE: os tokens @VARIAVEL@ precisam ser
# substituídos antes de copiar para /etc/nginx/conf.d/simple_website.conf.
# Veja "Caminhos e valores (Nginx)" em deploy/README.md.
#
#   @WEB_ROOT@      Diretório com o build do frontend (conteúdo do dist/).
#                   Qualquer caminho absoluto; o usuário do nginx (http/nginx)
#                   precisa ter permissão de leitura.
#   @BACKEND_HOST@  Host interno do backend Django.
#   @BACKEND_PORT@  Porta do backend Django.
#   @MEDIA_ROOT@    Caminho absoluto até a pasta `media/` do Django
#                   (SEM barra final).
#
# Exemplo (valores usados no projeto):
#   root          /var/www/dacomp_guessr;
#   proxy_pass    http://127.0.0.1:8000;
#   alias         /home/seuuser/DACOMP_Geoguessr/backend/DACOMP_Guessr/media/;
# ────────────────────────────────────────────────────────────────────────────

server {
    listen       80;
    server_name  _;

    # Servir o Frontend React
    location / {
        root  @WEB_ROOT@;
        index index.html;
        try_files $uri /index.html;
    }

    # Encaminhar chamadas de API para o Backend (ex: porta 8000)
    location /api/ {
        proxy_pass http://@BACKEND_HOST@:@BACKEND_PORT@; # sem barra no final mantém o /api/
        proxy_set_header Host $host; # passa o domínio do Cloudflare adiante
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket do Django Channels (jogo em tempo real)
    location /ws/ {
        proxy_pass http://@BACKEND_HOST@:@BACKEND_PORT@; # sem barra no final, mantém o caminho original
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout longo para o jogo não cair se ninguém mexer por um tempo
        proxy_read_timeout 86400;
    }

    # Arquivos de mídia do Django (ex.: imagens das rodadas em media/round_images/)
    location /media/ {
        # @MEDIA_ROOT@ → pasta `media/` do projeto Django no servidor (caminho absoluto)
        alias @MEDIA_ROOT@/;
        expires 7d;
        add_header Cache-Control "public";
    }
}
