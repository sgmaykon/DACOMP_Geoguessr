# ────────────────────────────────────────────────────────────────────────────
# Configuração principal do Nginx do projeto.
# Instalada em: /etc/nginx/nginx.conf
#
# Substitui o arquivo padrão da distribuição e padroniza o layout:
#   * /etc/nginx/nginx.conf        -> este arquivo (global)
#   * /etc/nginx/conf.d/*.conf     -> sites/vhosts (incluídos no bloco http)
#     O `simple_website.conf` do projeto entra por aqui.
#   * mime.types                   -> tipos MIME (path relativo ao prefixo do
#     nginx, normalmente /etc/nginx)
#
# Observação: em algumas distros o bloco de módulos dinâmicos pode nem existir.
# `include` com glob (modules.d/*.conf) que não casa nada é ignorado sem erro.
# ────────────────────────────────────────────────────────────────────────────

worker_processes  1;

# Carrega módulos dinâmicos instalados (globs que não casam são ignorados).
include modules.d/*.conf;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Todos os sites/vhosts do projeto entram por aqui.
    include /etc/nginx/conf.d/*.conf;

    sendfile           on;
    keepalive_timeout  65;
}